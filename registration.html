<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Coding Club Registraton</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 25px;
                line-height: 1.6;
                color: white;

                background-image:
                  linear-gradient(
                      rgba(3, 15, 30, 0.20),
                      rgba(3, 15, 30, 0.10)
                ),
                url("pexels-kindelmedia-7054792.jpg");

                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                background-repeat: no-repeat;
            }

            .container {
                max-width: 700px;
                margin: auto;
                background-color: rgba(7, 27, 48, 0.95);
                padding: 30px;
                border-radius: 12px;
                border: 1px solid #31516e;
            }

            h1 {
                text-align: center;
                color: #49baff;
            }

            .intro {
                text-align: center;
                margin-bottom: 25px;
                color: #d4e5f5;
            }
            fieldset {
            border: 1px solid #4384b5;
            border-radius: 8px;
            margin-bottom: 22px;
            padding: 20px;
        }

        legend {
            color: #49baff;
            font-weight: bold;
            padding: 0 10px;
        }

        label {
            display: inline-block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="number"],
        input[type="tel"],
        select,
        textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 5px;
            border: 1px solid #8caac2;
            border-radius: 5px;
            background-color: #f7fbff;
            color: #172b3d;
            font-size: 15px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 7px;
        }

        .choice {
            margin-right: 15px;
        }

        input[type="color"] {
            width: 60px;
            height: 40px;
            margin-top: 8px;
            cursor: pointer;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
            margin-right: 10px;
        }

        .register {
            background-color: #087ed1;
            color: white;
        }

        .register:hover {
            background-color: #159cff;
        }

        .clear {
            background-color: #dce6ef;
            color: #172b3d;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #49baff;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #c5d6e5;
        }

        @faytech (max-width: 500px) {
            .container {
                padding: 18px;
            }

            fieldset {
                padding: 12px;
            }

            button {
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a class="back" href="index.html">
            &larr; Back to My Portfolio
        </a>

        <h1>📝 Coding Club Registration</h1>

        <p class="intro">
            Interested in technology? Join our Coding Club
            and begin your programming journey!
        </p>

        <form action="#" method="post">

            <fieldset>
                <legend>About You</legend>

                <p>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name" required>
                </p>

                <p>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </p>

                <p>
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob">
                </p>

                <p>
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age"
                           min="8" max="25" placeholder="Enter your age">
                </p>

                <p>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter your phone number">
                </p>
            </fieldset>

            <fieldset>
                <legend>Your Choices</legend>

                <p>Gender:</p>

                <label class="choice">
                    <input type="radio" name="gender" value="f">
                    Female
                </label>

                <label class="choice">
                    <input type="radio" name="gender" value="m">
                    Male
                </label>

                <p>
                    <label for="class">Class:</label>
                    <select id="class" name="class">
                        <option value="JSS 3">JSS 3</option>
                        <option value="SS 1">SS 1</option>
                        <option value="SS 2">SS 2</option>
                        <option value="SS 3">SS 3</option>
                    </select>
                </p>

                <p>I am interested in:</p>

                <label class="choice">
                    <input type="checkbox" name="interest"
                           value="web">
                    Websites
                </label>

                <label class="choice">
                    <input type="checkbox" name="interest"
                           value="games">
                    Games
                </label>

                <label class="choice">
                    <input type="checkbox" name="interest"
                           value="ai">
                    AI
                </label>

                <p>
                    <label for="why">
                        Why do you want to join?
                    </label>

                    <textarea id="why" name="why" rows="4"
                              placeholder="Tell us why you are interested in coding..."></textarea>
                </p>

                <p>
                    <label for="colour">Favourite Colour:</label><br>
                    <input type="color" id="colour" name="colour"
                           value="#159cff">
                </p>
            </fieldset>

            <button type="submit" class="register">
                Register 🚀
            </button>

            <button type="reset" class="clear">
                Clear
            </button>

        </form>

        <footer>
            <p>&copy; 2026 Coding Club | Learn, Create, Innovate</p>
        </footer>

    </div>

</body>
</html>
            
        </style>
    </head>
</html>
